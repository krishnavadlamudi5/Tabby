name: Deploy Live OTA Update

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-live-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: the app version is the commit count

      - name: Compute App Version
        id: version
        # One version per commit, derived from git history, so the APK and the
        # OTA bundle built from the same commit always carry the same number.
        # 1.1.x is used so it sorts above the legacy v1.0.<run_number> tags.
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "version=1.1.$COUNT" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "App version: 1.1.$COUNT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build
        env:
          VITE_API_URL: https://tabby-api-bpb4.onrender.com/api
          VITE_GOOGLE_CLIENT_ID: 888676247797-cn7buordb6vqmd7qm6a35u8n6smievcr.apps.googleusercontent.com
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
          VITE_APP_COMMIT: ${{ github.sha }}
          VITE_APP_BUILD_DATE: ${{ steps.version.outputs.date }}

      - name: Package dist folder into dist.zip
        run: |
          # `zip -r` UPDATES an existing archive rather than replacing it, so any
          # stale dist.zip in the tree would leave old entries inside the release
          # bundle. Always start from a clean archive.
          rm -f dist.zip
          (cd dist && zip -r ../dist.zip .)
          unzip -l dist.zip
          # capacitor-updater refuses the whole bundle if any zip entry uses a
          # Windows path separator, so fail loudly here instead of shipping it.
          if unzip -l dist.zip | grep -q '\\'; then
            echo "::error::dist.zip contains backslash paths - capacitor-updater will refuse it"
            exit 1
          fi
          # A bundle without index.html at the root is not loadable either.
          if ! unzip -l dist.zip | grep -qE ' index\.html$'; then
            echo "::error::dist.zip has no index.html at its root"
            exit 1
          fi

      - name: Extract Commit Message
        id: commit_info
        run: |
          COMMIT_TITLE=$(git log -1 --pretty=%s)
          echo "title=$COMMIT_TITLE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with dist.zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }} - ${{ steps.commit_info.outputs.title }}
          body: |
            ### 🚀 What's New in this Update:
            ${{ steps.commit_info.outputs.title }}

            ---
            - **Version**: `v${{ steps.version.outputs.version }}`
            - **Commit**: `${{ github.sha }}`
            - **Build**: #${{ github.run_number }}
            - **Date**: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
          files: dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
