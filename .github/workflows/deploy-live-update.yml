name: Deploy Live OTA Update

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-live-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build
        env:
          VITE_API_URL: https://tabby-6i0f.onrender.com/api
          VITE_GOOGLE_CLIENT_ID: 888676247797-cn7buordb6vqmd7qm6a35u8n6smievcr.apps.googleusercontent.com

      - name: Package dist folder into dist.zip
        run: |
          # `zip -r` UPDATES an existing archive rather than replacing it, so any
          # stale dist.zip in the tree would leave old entries inside the release
          # bundle. Always start from a clean archive.
          rm -f dist.zip
          (cd dist && zip -r ../dist.zip .)
          unzip -l dist.zip
          # capacitor-updater refuses the whole bundle if any zip entry uses a
          # Windows path separator, so fail loudly here instead of shipping it.
          if unzip -l dist.zip | grep -q '\\'; then
            echo "::error::dist.zip contains backslash paths - capacitor-updater will refuse it"
            exit 1
          fi
          # A bundle without index.html at the root is not loadable either.
          if ! unzip -l dist.zip | grep -qE ' index\.html$'; then
            echo "::error::dist.zip has no index.html at its root"
            exit 1
          fi

      - name: Extract Commit Message
        id: commit_info
        run: |
          COMMIT_TITLE=$(git log -1 --pretty=%s)
          echo "title=$COMMIT_TITLE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with dist.zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }} - ${{ steps.commit_info.outputs.title }}
          body: |
            ### 🚀 What's New in this Update:
            ${{ steps.commit_info.outputs.title }}

            ---
            - **Version**: `v1.0.${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Build**: #${{ github.run_number }}
            - **Date**: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
          files: dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
