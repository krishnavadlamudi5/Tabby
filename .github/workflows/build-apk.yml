name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: the app version is the commit count

      - name: Compute App Version
        id: version
        # One version per commit, derived from git history, so the APK and the
        # OTA bundle built from the same commit always carry the same number.
        # 1.1.x is used so it sorts above the legacy v1.0.<run_number> tags.
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "version=1.1.$COUNT" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "App version: 1.1.$COUNT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build
        env:
          VITE_API_URL: https://tabby-api-bpb4.onrender.com/api
          VITE_GOOGLE_CLIENT_ID: 888676247797-cn7buordb6vqmd7qm6a35u8n6smievcr.apps.googleusercontent.com
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
          VITE_APP_COMMIT: ${{ github.sha }}
          VITE_APP_BUILD_DATE: ${{ steps.version.outputs.date }}

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
        env:
          TABBY_VERSION_CODE: ${{ steps.version.outputs.count }}
          TABBY_VERSION_NAME: ${{ steps.version.outputs.version }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Tabby-Android-App-Debug-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
