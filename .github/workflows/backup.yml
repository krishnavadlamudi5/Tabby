name: Database backup

# Nightly encrypted MongoDB backup to Cloudflare R2 (Atlas M0 has no
# snapshots). Free: runs on GitHub Actions, stores in R2's free 10 GB.
# Set an R2 lifecycle rule on the "backups/" prefix to delete old copies.
#
# Repository secrets: MONGODB_URI, BACKUP_PASSPHRASE (long random; keep a
# copy offline), R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
# R2_BUCKET.
#
# Restore:  aws s3 cp s3://$R2_BUCKET/backups/<file> . --endpoint-url ...
#           openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_PASSPHRASE -in <file> -out dump.archive.gz
#           mongorestore --uri "$MONGODB_URI" --archive=dump.archive.gz --gzip

on:
  schedule:
    - cron: '47 20 * * *' # 02:17 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dump, encrypt and upload
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto
        run: |
          for v in MONGODB_URI BACKUP_PASSPHRASE R2_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!v}" ]; then echo "$v is not set; skipping backup."; exit 0; fi
          done
          set -euo pipefail
          name="tabby-$(date -u +%Y-%m-%dT%H%M%SZ).archive.gz.enc"
          docker run --rm -e MONGODB_URI mongo:7 sh -c 'mongodump --uri "$MONGODB_URI" --archive --gzip' > dump.archive.gz
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -in dump.archive.gz -out "$name"
          rm dump.archive.gz
          aws s3 cp "$name" "s3://$R2_BUCKET/backups/$name" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          echo "Uploaded backups/$name ($(stat -c %s "$name") bytes)"
